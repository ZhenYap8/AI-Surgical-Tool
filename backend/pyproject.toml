[project]
name = "ai-surgical-tool-api"
version = "0.1.0"
description = "Surgical training risk assessment API"
requires-python = ">=3.9"

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
